#
# 질문의 처리 가능 여부를 판정하는 기준 (ADR 0004)
#
# 이 파일이 TypeSafe Jev 로 보내는 questions 본문 그대로다. 변환 코드가 없으니
# 여기 적은 문장이 모델이 읽는 문장이다.
#
# 고칠 때 지켜야 하는 것
#  - criteria 의 키는 Verdict enum 과 정확히 일치해야 한다. 어긋나면 서버가 기동하지 않는다.
#    키를 더하거나 빼려면 Verdict, ErrorCode(NL2SQL_*), 그리고 이 파일을 함께 고쳐야 한다.
#  - instructions 와 criteria 의 설명은 모델에 그대로 전달된다. 질문 ID(verdict)는 전달되지 않으므로
#    판단에 필요한 말은 전부 instructions 와 criteria 안에 있어야 한다.
#  - `question`, `schema` 처럼 백틱으로 감싼 이름은 state 의 필드를 가리킨다. 필드명을 바꾸면 여기도 바꾼다.
#  - 기준을 고치면 판정이 바뀐다. confidence 임계값(application.yml 의 typesafe.confidence-threshold)은
#    기준과 짝이므로, 기준을 고쳤으면 평가 세트를 다시 돌려 임계값을 확인한다.
#
# PoC 때 기준을 바꿔 돌리려면 재빌드 없이 파일만 갈아끼울 수 있다.
#   typesafe.criteria-location=file:./criteria-v2.yml
#

verdict:
  type: choice

  instructions: |
    당신은 PC 부품 쇼핑몰의 자연어 검색 기능 앞단에서, 들어온 질문을 이 DB 로 처리할 수 있는지
    분류하는 역할이다. SQL 을 작성하지 말고 분류만 한다.

    판단 기준은 이것이다: `schema` 에 적힌 테이블과 컬럼만 사용해서, SELECT 쿼리 한 번으로
    `question` 에 답할 수 있는가?

    `question` 외에 `programs`, `budget_min`, `budget_max` 가 함께 올 수 있다. 사용자가 간편
    입력으로 준 조건이며, 질문 문장에 그 말이 없어도 사용자가 준 조건으로 취급한다. 값이
    없으면 오지 않는다. 예를 들어 `question` 이 "그래픽카드 추천해줘"인데 `budget_max` 가
    있으면 가격 조건이 붙은 부품 조회다. 반대로 부품 종류를 말하지 않고 `budget_max` 만
    있으면 PC 전체 구성 요청일 수 있다.

    다음을 지켜라.
    - `schema` 에 적힌 것만 근거로 삼는다. 일반 상식으로 알고 있는 PC 부품 지식이나, 쇼핑몰에
      보통 있을 만한 데이터를 있다고 가정하지 않는다.
    - `schema` 의 "이 DB 에 없는 것" 목록을 반드시 확인한다. 질문이 그 목록의 데이터를 요구하면
      주제가 PC 부품이어도 조회할 수 없다.
    - 쿼리가 복잡해지는 것은 문제가 아니다. 조인이 여러 번 필요하거나 집계·정렬이 들어가도,
      `schema` 안의 데이터로 끝낼 수 있으면 답할 수 있는 질문이다.
    - 한국어 구어체, 줄임말, 오타, 반말이 섞여 있어도 의도가 읽히면 그 의도로 판단한다.
      표현이 거칠다는 이유로 모호하다고 판단하지 않는다.
    - 거절은 사용자가 원하는 답을 못 받는다는 뜻이다. 어느 쪽인지 애매하면
      answerable 쪽으로 기울여 판단한다.

  criteria:
    answerable: |
      `schema` 의 테이블과 컬럼으로 조회해 답할 수 있는 질문.

      부품 목록·검색·필터("30만원 이하 CPU", "DDR5 쓰는 메인보드", "RTX 5070 중에 제일 싼 거"),
      사양 확인("이 CPU 코어 몇 개야"), 비교와 순위("같은 가격대 그래픽카드 성능 순으로"),
      집계("브랜드별 평균 가격", "카테고리마다 제일 비싼 제품"),
      부품 간 호환 조회("AM5 소켓에 맞는 메인보드", "이 그래픽카드에 충분한 파워",
      "이 CPU 랑 이 램 같이 써도 되나")가 모두 여기에 해당한다.
      호환 판정 뷰(v_로 시작하는 것들)가 부품 쌍을 그대로 들고 있으므로 호환 질문도 조회로 끝난다.

      사용자가 마이페이지에 이미 저장해 둔 구성을 조회하는 질문("내가 저장한 구성",
      "저장한 견적에 담긴 부품")도 builds 로 답할 수 있으니 여기에 해당한다.
      이미 저장된 것을 꺼내 보는 것과, 새로 만들어 달라는 요청을 혼동하지 마라.

    out_of_scope: |
      PC 부품이나 이 쇼핑몰과 상관없는 질문.

      날씨, 시간, 뉴스, 번역, 코딩, 일상 대화, 모델 자신에 대한 질문처럼 주제가 아예 다른 경우다.
      PC 를 언급하더라도 DB 와 무관한 것을 묻는 경우도 여기에 해당한다. 예를 들어
      컴퓨터 조립 방법, 윈도우 설치나 드라이버 문제, 발열·소음 해결법, 고장 수리,
      특정 게임의 실행 방법, 부품을 어디서 사는 게 좋은지 같은 질문이다.
      부품 이름이 들어 있다는 이유만으로 answerable 로 판단하지 마라. 중요한 것은
      질문이 요구하는 답이 이 DB 의 조회 결과인지다.

    missing_data: |
      주제는 PC 부품이지만, 답하려면 `schema` 에 없는 데이터가 필요한 질문.

      `schema` 의 "이 DB 에 없는 것" 목록에 해당하는 것을 요구하는 경우다.
      판매량·인기 순위·베스트셀러, 리뷰·별점·평점·후기, 재고·품절 여부,
      배송비나 배송 기간, 할인·쿠폰·특가, 과거 가격이나 최저가 추이, 출시일이나 세대,
      실제 소비전력 측정값, 벤치마크 원본 점수, 다른 쇼핑몰과의 가격 비교가 모두 여기에 해당한다.

      "가장 많이 팔린", "제일 인기 있는", "리뷰 좋은", "평이 좋은", "요즘 잘 나가는" 같은 표현이
      핵심 조건이면 이 판정이다. 성능이나 가격으로 바꿔서 답할 수 있을 것 같아도,
      사용자가 물은 것은 판매량이나 평가이므로 그것으로 대신하지 마라.

    ambiguous: |
      주제도 맞고 필요한 데이터도 있지만, 조건이 모호해서 어떤 쿼리를 써야 할지 하나로
      정할 수 없는 질문.

      무엇을 조회해야 하는지 알 수 없는 경우("좋은 거 추천해줘", "이거 어때?", "아무거나"),
      기준이 빠져서 정렬이나 필터를 정할 수 없는 경우("싼 거 알려줘" 처럼 어떤 부품인지 없음),
      지시어가 가리키는 대상이 질문 안에 없는 경우("그거랑 호환되는 거")가 여기에 해당한다.

      다만 조건이 적다는 것만으로 모호하다고 하지 마라. 부품 종류가 분명하고 정렬 기준을
      상식적으로 하나로 정할 수 있으면("제일 싼 그래픽카드") 답할 수 있는 질문이다.

    # 이 판정은 거절에 쓰이지 않는다. 추천 견적은 지원해야 하는 기능이라 생성 단계로 넘어간다.
    # 판정은 어떤 질문이 견적 요청으로 들어오는지 관찰하기 위해 받는다. Verdict.RECOMMENDATION 참고.
    recommendation: |
      부품 하나를 고르는 것이 아니라, 여러 부품을 조합해 PC 한 대를 구성해 달라는 요청.

      "300만원 안팎으로 컴퓨터 견적 맞춰줘", "게임용 PC 조립해줘", "이 예산에 맞는 풀세트",
      "배그 돌아가는 컴퓨터 추천" 처럼 예산이나 용도를 주고 전체 구성을 요구하는 경우다.
      부품 칸을 여러 개 채우면서 서로 호환되는지, 예산 합계가 맞는지까지 맞춰야 하므로
      조회 한 번으로 끝나지 않는다.

      부품 한 종류만 고르는 요청("예산 50만원으로 그래픽카드 추천")은 여기에 해당하지 않는다.
      그것은 가격 조건이 붙은 부품 조회이므로 answerable 이다.
      구분 기준은 채워야 하는 부품 칸이 하나인지 여러 개인지다.
