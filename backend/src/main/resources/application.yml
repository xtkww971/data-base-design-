spring:
  application:
    name: data-base-design
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

nl2sql:
  base-url: ${NL2SQL_BASE_URL:http://localhost:8000}
  connect-timeout: 3s
  read-timeout: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
