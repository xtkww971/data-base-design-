# 빌드된 정적 파일을 서빙하고, /api 는 backend 컨테이너로 넘긴다 (개발 서버의 vite proxy 와 같은 역할).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nl2sql 질의는 LLM 응답을 기다리므로 넉넉하게 둔다 (백엔드 read-timeout 60s)
        proxy_read_timeout 90s;
    }

    # react-router 의 클라이언트 라우팅: 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
